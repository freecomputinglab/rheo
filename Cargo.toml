[workspace]
resolver = "2"
members = ["crates/core", "crates/html", "crates/pdf", "crates/epub", "crates/cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Lachlan Kermode <lachie@ohrg.org>"]
description = "A typesetting and static site engine based on Typst"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freecomputinglab/rheo"
readme = "README.md"

[workspace.dependencies]
# Internal crates (for convenience in workspace)
rheo-core = { path = "crates/core", version = "0.6.0" }
rheo-html = { path = "crates/html", version = "0.6.0" }
rheo-pdf = { path = "crates/pdf", version = "0.6.0" }
rheo-epub = { path = "crates/epub", version = "0.6.0" }

# Typst dependencies
typst = "0.15.0"
typst-library = "0.15.0"
typst-pdf = "0.15.0"
typst-html = "0.15.0"
typst-kit = { version = "0.15.0", features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader"] }
typst-syntax = "0.15.0"
typst-layout = "0.15.0"
typst-bundle = "0.15.0"
comemo = "0.5"

# Error handling and diagnostics
codespan-reporting = "0.13"
thiserror = "2.0"
anyhow = "1.0.100"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
toml_edit = "0.22"
semver = "1.0"

# CLI and utilities
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
opener = "0.8"
parking_lot = "0.12"
atty = "0.2"
pathdiff = "0.2"
notify = "8.2"
mime_guess = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File system and patterns
globset = "0.4"
glob = "0.3"
tempfile = "3.8"
dirs = "6"

# Development server (HTML plugin uses, CLI also uses)
tokio = { version = "1", features = ["rt", "sync", "time", "signal", "rt-multi-thread", "macros"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
webbrowser = "1.0"
tokio-stream = { version = "0.1", features = ["sync"] }

# EPUB dependencies
zip = { version = "8.6", default-features = false }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
iref = { version = "4.0", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
itertools = "0.15"

# Compression / archive
flate2 = { version = "1", features = ["zlib-rs"] }
tar = "0.4"

# Other dependencies
ecow = "0.2"
regex = "1.10"
serde-xml-rs = "0.8.2"

# To use Typst's git main branch instead of the pinned crates.io release (e.g. to
# test unreleased features), uncomment the [patch.crates-io] block below.
# Cargo strips [patch] on publish, so crates.io releases always use the pinned versions.
#
# [patch.crates-io]
# typst        = { git = "https://github.com/typst/typst" }
# typst-library = { git = "https://github.com/typst/typst" }
# typst-pdf    = { git = "https://github.com/typst/typst" }
# typst-html   = { git = "https://github.com/typst/typst" }
# typst-kit    = { git = "https://github.com/typst/typst" }
# typst-syntax = { git = "https://github.com/typst/typst" }
# comemo       = { git = "https://github.com/typst/comemo" }

[profile.release]
opt-level = 1
lto = true
codegen-units = 1

[profile.local-dev]
inherits = "dev"

# Makes Typst run quickly without impacting incremental compile times
[profile.local-dev.package."*"]
opt-level = 3
