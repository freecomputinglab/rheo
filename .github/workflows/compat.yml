name: Compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compat:
    name: Compatibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Compat projects import @rheo/* packages whose built dist/ entrypoints
      # are not committed, so clone rheo-packages and run its pnpm/vite builds.
      - name: Install @rheo packages
        uses: ./.github/actions/install-rheo-packages

      - name: Clone rheo-tests as sibling
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RHEO_TESTS_REF="rheo/$BRANCH"
          if git ls-remote --exit-code --heads https://github.com/freecomputinglab/rheo-tests.git "$RHEO_TESTS_REF" &>/dev/null; then
            echo "Using rheo-tests branch: $RHEO_TESTS_REF"
          else
            RHEO_TESTS_REF="main"
            echo "Using rheo-tests branch: main"
          fi
          git clone --depth 1 --branch "$RHEO_TESTS_REF" https://github.com/freecomputinglab/rheo-tests.git ../rheo-tests

      - name: Run compatibility tests
        run: cargo test --test compat
        working-directory: ../rheo-tests
        env:
          RUN_COMPAT_TESTS: "1"
          TYPST_IGNORE_SYSTEM_FONTS: "1"
          RHEO_MANIFEST: ${{ github.workspace }}/Cargo.toml
