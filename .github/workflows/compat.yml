name: Compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compat:
    name: Compatibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Compat projects import @rheo/* packages whose built dist/ entrypoints
      # are not committed, so clone rheo-packages and run its pnpm/vite builds.
      - name: Install @rheo packages
        uses: ./.github/actions/install-rheo-packages

      - name: Run compatibility tests
        run: cargo test --test compat
        env:
          RUN_COMPAT_TESTS: "1"
          TYPST_IGNORE_SYSTEM_FONTS: "1"
