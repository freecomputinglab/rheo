name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install @rheo packages
        uses: ./.github/actions/install-rheo-packages

      - name: Clone rheo-tests as sibling
        shell: bash
        run: |
          # Mirror convention: if a rheo-tests branch named rheo/<this-branch> exists, use it.
          # This lets a rheo PR pair with its rheo-tests snapshot branch before either merges.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RHEO_TESTS_REF="rheo/$BRANCH"
          if git ls-remote --exit-code --heads https://github.com/freecomputinglab/rheo-tests.git "$RHEO_TESTS_REF" &>/dev/null; then
            echo "Using rheo-tests branch: $RHEO_TESTS_REF"
          else
            RHEO_TESTS_REF="main"
            echo "Using rheo-tests branch: main"
          fi
          git clone --depth 1 --branch "$RHEO_TESTS_REF" https://github.com/freecomputinglab/rheo-tests.git ../rheo-tests

      - name: Run tests
        run: cargo test --all-targets --all-features
        working-directory: ../rheo-tests
        env:
          RHEO_MANIFEST: ${{ github.workspace }}/Cargo.toml
          TYPST_IGNORE_SYSTEM_FONTS: "1"
