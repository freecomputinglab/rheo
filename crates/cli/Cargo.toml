[package]
name = "rheo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "rheo"
path = "src/main.rs"

[dependencies]
# Internal crates
rheo-core = { workspace = true }
rheo-html = { workspace = true }
rheo-pdf = { workspace = true }
rheo-epub = { workspace = true }

# Typst syntax tree, for migrating authored source by span rather than by regex
typst-syntax = { workspace = true }

# CLI and utilities
clap = { workspace = true }
codespan-reporting = { workspace = true }
walkdir = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
atty = { workspace = true }

# Serialization
toml_edit = { workspace = true }

# Patterns
glob = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
