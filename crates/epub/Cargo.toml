[package]
name = "rheo-epub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["timings"]
# Forwarded, not owned: the instrumentation lives in rheo-core, and this
# crate pulls it without default features so that `--no-default-features` on
# the binary is not undone by a plugin re-enabling them.
timings = ["rheo-core/timings"]

[dependencies]
# Core
rheo-core = { workspace = true }
typst = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde-xml-rs = { workspace = true }
toml = { workspace = true }

# Date/time
chrono = { workspace = true }

# EPUB-specific
zip = { workspace = true }
iref = { workspace = true }
uuid = { workspace = true }
itertools = { workspace = true }
mime_guess = { workspace = true }

# Logging
tracing = { workspace = true }

# File utilities
tempfile = { workspace = true }
